<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff26;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#00ff26;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#00ff26;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <rect width="1000" height="600" fill="#060606" />
  
  <!-- Abstract Strokes -->
  <path d="M-100 100 L400 350 L600 200 L1100 450" stroke="#00ff26" stroke-width="2" fill="none" opacity="0.3" filter="url(#glow)" />
  <path d="M1100 100 L700 300 L400 150 L-100 400" stroke="#00ff26" stroke-width="1.5" fill="none" opacity="0.2" filter="url(#glow)" />
  <path d="M200 -100 L500 600" stroke="#00ff26" stroke-width="1" fill="none" opacity="0.1" />
  <path d="M800 -100 L500 600" stroke="#00ff26" stroke-width="1" fill="none" opacity="0.1" />
  
  <!-- Tech Details (dots) -->
  <circle cx="400" cy="350" r="3" fill="#00ff26" opacity="0.6" filter="url(#glow)" />
  <circle cx="600" cy="200" r="2" fill="#00ff26" opacity="0.4" filter="url(#glow)" />
  <circle cx="700" cy="300" r="3" fill="#00ff26" opacity="0.5" filter="url(#glow)" />
  <circle cx="400" cy="150" r="2" fill="#00ff26" opacity="0.3" filter="url(#glow)" />

  <!-- Grid-like elements -->
  <line x1="0" y1="100" x2="1000" y2="100" stroke="#00ff26" stroke-width="0.5" opacity="0.05" />
  <line x1="0" y1="200" x2="1000" y2="200" stroke="#00ff26" stroke-width="0.5" opacity="0.05" />
  <line x1="0" y1="300" x2="1000" y2="300" stroke="#00ff26" stroke-width="0.5" opacity="0.05" />
  <line x1="0" y1="400" x2="1000" y2="400" stroke="#00ff26" stroke-width="0.5" opacity="0.05" />
  <line x1="0" y1="500" x2="1000" y2="500" stroke="#00ff26" stroke-width="0.5" opacity="0.05" />
</svg>
